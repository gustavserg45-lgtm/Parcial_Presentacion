name: ${COMPOSE_PROJECT_NAME:-sanluquitas}

services:
  portal-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${PORTAL_DB_NAME:?Define PORTAL_DB_NAME en .env}
      MARIADB_USER: ${PORTAL_DB_USER:?Define PORTAL_DB_USER en .env}
      MARIADB_PASSWORD: ${PORTAL_DB_PASSWORD:?Define PORTAL_DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${PORTAL_DB_ROOT_PASSWORD:?Define PORTAL_DB_ROOT_PASSWORD en .env}
    volumes:
      - portal-db-data:/var/lib/mysql
    networks:
      - portal-private
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      portal-db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-San Luquitas Digital}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
      APP_URL: ${APP_URL:-http://localhost:8083}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8084}
      DB_CONNECTION: mysql
      DB_HOST: portal-db
      DB_PORT: 3306
      DB_DATABASE: ${PORTAL_DB_NAME:?Define PORTAL_DB_NAME en .env}
      DB_USERNAME: ${PORTAL_DB_USER:?Define PORTAL_DB_USER en .env}
      DB_PASSWORD: ${PORTAL_DB_PASSWORD:?Define PORTAL_DB_PASSWORD en .env}
      NEWS_ADMIN_TOKEN: ${NEWS_ADMIN_TOKEN:?Define NEWS_ADMIN_TOKEN en .env}
    ports:
      - "${PORTAL_HTTP_PORT:-8083}:80"
    networks:
      - portal-private
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  moodle-db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MOODLE_DB_NAME:?Define MOODLE_DB_NAME en .env}
      MARIADB_USER: ${MOODLE_DB_USER:?Define MOODLE_DB_USER en .env}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:?Define MOODLE_DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Define MARIADB_ROOT_PASSWORD en .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - moodle-db-data:/var/lib/mysql
    networks:
      - moodle-private
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  moodle:
    image: moodlehq/moodle-php-apache:${MOODLE_PHP_IMAGE_TAG:-8.3}
    restart: unless-stopped
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/public
      MOODLE_DB_HOST: moodle-db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:?Define MOODLE_DB_NAME en .env}
      MOODLE_DB_USER: ${MOODLE_DB_USER:?Define MOODLE_DB_USER en .env}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?Define MOODLE_DB_PASSWORD en .env}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8084}
      "PHP_INI-max_input_vars": 5000
      "PHP_INI-memory_limit": 256M
      "PHP_INI-upload_max_filesize": 64M
      "PHP_INI-post_max_size": 64M
    ports:
      - "${MOODLE_HTTP_PORT:-8084}:80"
    volumes:
      - ../.runtime/moodle:/var/www/html:ro,z
      - moodle-data:/var/www/moodledata
    networks:
      - moodle-private

  moodle-cron:
    image: moodlehq/moodle-php-apache:${MOODLE_PHP_IMAGE_TAG:-8.3}
    restart: unless-stopped
    depends_on:
      moodle:
        condition: service_started
    environment:
      MOODLE_DB_HOST: moodle-db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:?Define MOODLE_DB_NAME en .env}
      MOODLE_DB_USER: ${MOODLE_DB_USER:?Define MOODLE_DB_USER en .env}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:?Define MOODLE_DB_PASSWORD en .env}
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8084}
      "PHP_INI-max_input_vars": 5000
      "PHP_INI-memory_limit": 256M
      "PHP_INI-upload_max_filesize": 64M
      "PHP_INI-post_max_size": 64M
    volumes:
      - ../.runtime/moodle:/var/www/html:ro,z
      - moodle-data:/var/www/moodledata
    networks:
      - moodle-private
    user: www-data
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      'while true; do
      if [ -f /var/www/html/admin/cli/cron.php ]; then
      php /var/www/html/admin/cli/cron.php --disable-output;
      fi;
      sleep 60;
      done'

volumes:
  portal-db-data:
  moodle-db-data:
  moodle-data:

networks:
  portal-private:
    internal: true
  moodle-private:
    internal: true

